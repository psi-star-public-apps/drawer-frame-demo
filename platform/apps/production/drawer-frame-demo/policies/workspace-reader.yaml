apiVersion: platform.psi/2026-03-01
kind: policy
id: workspace-reader
name: Workspace Reader
spec:
  rules:
    - effect: allow
      subjects:
        - workspace:user
      actions:
        - read
        - execute
      resources:
        - page:home
        - component:certification-summary
        - component:open-detail-drawer
        - component:open-filter-drawer
        - component:open-form-drawer
        - component:open-overlayless-drawer
        - component:open-hidden-editor-drawer
        - frameSurface:detail-drawer
        - frameSurface:filter-drawer
        - frameSurface:form-drawer
        - frameSurface:overlayless-drawer
        - frameSurface:hidden-editor-drawer
        - frameSurface:stack-primary-drawer
        - frameSurface:stack-secondary-drawer
        - frameSurface:mobile-diagnostic-drawer
        - frameSurface:global-navigation-drawer
        - event:open-detail-drawer-click
        - event:open-filter-drawer-click
        - event:open-form-drawer-click
        - event:open-hidden-editor-drawer-click
        - event:open-overlayless-drawer-click
